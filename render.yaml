services:
  - type: web
    name: npc-memory-webservice  # Matches the live service (npc-memory-webservice.onrender.com)
    runtime: docker
    plan: free
    region: oregon

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Database
      - key: DATABASE_URL
        sync: false
      
      # Application
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://npc-memory-webservice.onrender.com  # Pages are served by this app itself
      - key: SERVICE_API_KEY
        generateValue: true
      - key: REQUIRE_SERVICE_API_KEY
        value: "true"
      - key: ALLOWED_EMAIL_DOMAINS
        value: ""
      - key: ALLOWED_EMAILS
        value: ""
      
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      
      # External LLM Configuration
      - key: USE_EXTERNAL_LLM
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      
    healthCheckPath: /health
    autoDeploy: true
